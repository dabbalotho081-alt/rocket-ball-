name: Build IPA
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Bundle three.js so the game works offline
        run: |
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o RocketBall/www/three.min.js
          sed -i '' 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' RocketBall/www/index.html

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project RocketBall.xcodeproj -scheme RocketBall \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R "build/Build/Products/Release-iphoneos/Rocket Ball.app" Payload/
          zip -qry RocketBall-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: RocketBall-ipa
          path: RocketBall-unsigned.ipa
