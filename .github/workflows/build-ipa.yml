name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild -project RocketBall.xcodeproj -scheme RocketBall \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 40
          test -d build/Build/Products/Release-iphoneos/RocketBall.app

      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/RocketBall.app Payload/
          zip -qry RocketBall.ipa Payload
          ls -lh RocketBall.ipa

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RocketBall-ipa
          path: RocketBall.ipa

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rocket Ball build ${{ github.run_number }}
          body: Unsigned IPA built from ${{ github.sha }}. Sideload with AltStore, Sideloadly, TrollStore or similar.
          files: RocketBall.ipa

      - name: Push IPA to the release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REL="$RUNNER_TEMP/release"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin release >/dev/null 2>&1; then
            git clone --depth 1 --branch release "$URL" "$REL"
          else
            mkdir -p "$REL"
            git -C "$REL" init -b release
            git -C "$REL" remote add origin "$URL"
          fi
          cp RocketBall.ipa "$REL/RocketBall.ipa"
          cat > "$REL/README.md" <<EOT
          # Rocket Ball 3D — IPA

          Latest build: **RocketBall.ipa** (build ${{ github.run_number }}, from commit ${{ github.sha }}).

          This branch only holds the built app. Source code lives on \`main\`.
          The IPA is unsigned — install it with AltStore, Sideloadly or TrollStore.
          EOT
          cd "$REL"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "RocketBall.ipa build ${{ github.run_number }}" || exit 0
          git push origin release
